name: DevOps Academy CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q app

      - name: Build Docker image
        run: docker build -t devops-learning-platform:ci .

      - name: Start Docker container
        run: docker run -d --name devops-academy-test -p 8080:8080 devops-learning-platform:ci

      - name: Test application health
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-academy-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f devops-academy-test || true
