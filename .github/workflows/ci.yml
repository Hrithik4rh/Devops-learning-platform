
name: DevOps Academy CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q app

      - name: Build Docker image
        run: docker build -t devops-learning-platform:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name devops-academy-test \
            -p 8080:8080 \
            devops-learning-platform:ci

      - name: Test application health
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-academy-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f devops-academy-test || true

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997065851788:role/github-actions-ecr-role
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-learning-platform
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
